<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventarioPro - Gestión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">InventarioPro</a>
            <div class="nav-menu">
                <a href="login.html" class="nav-item">Salir</a>
                <a href="inventario.html" class="nav-item active">Inventario</a>
                <a href="usuarios.html" class="nav-item">Usuarios</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Agregar Nuevo Producto</h2>
            <p>Ingrese los detalles del producto para actualizar el stock global.</p>

            <form id="producto-form" class="producto-form">
                <div class="grupo">
                    <label for="nombre">Nombre del Producto</label>
                    <input type="text" id="nombre" placeholder="Ej. Laptop Dell XPS 13" required>
                </div>

                <div class="grupo">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" placeholder="0" required>
                </div>

                <div class="grupo">
                    <label for="precio">Precio (USD)</label>
                    <input type="number" step="0.01" id="precio" placeholder="0.00" required>
                </div>

                <button type="submit" class="btn-agregar" id="btnGuardar">
                    <i class="fa-solid fa-plus"></i>
                    Agregar Producto
                </button>
            </form>
        </div>

        <div class="card">
            <div class="encabezado-tabla">
                <div>
                    <h2>Gestión de Inventario</h2>
                    <p>Visualización y edición de todos los artículos registrados.</p>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Stock</th>
                        <th>Precio Unitario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos">
                    
                    
                </tbody>
            </table>

            <div class="footer-tabla">
                <span>Mostrando 3 productos registrados</span>
            </div>
        </div>
    </div>
<script src="inventario.js"></script>
</body>
</html>
